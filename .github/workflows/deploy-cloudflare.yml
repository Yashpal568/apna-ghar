name: Deploy Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1f6f29f6833bc91fbdfc10c3ba035ad
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions variable or secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) echo "Using Clerk Production publishable key." ;;
            pk_test_*) echo "::warning::Using Clerk Development key. This deployment is for temporary testing only; do not treat it as a production-auth launch." ;;
            *) echo "::error::Clerk publishable key must start with pk_live_ or pk_test_"; exit 1 ;;
          esac
      - name: Install locked workspace dependencies
        run: npm ci --include=dev
      - name: Build and deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1f6f29f6833bc91fbdfc10c3ba035ad
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: https://apna-ghar-api-j4fo.onrender.com/api/v1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          ADMIN_CLERK_USER_IDS: "user_3M0Lx42jLgKmbAPvo6kJiLZgccC,user_3LSfCyLdR69L1O1ovcKkenvdrMK,user_3LHtWTA9Vf1Il8C98rCZOut7xiu,user_3LSgkWc0aC8JqvhF9CfR2AYdqCK"
        run: npm run deploy:cloudflare
      - name: Verify deployed Worker serves this exact commit
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          HOME_URL: https://apna-ghar-web.yash38688.workers.dev/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error "$HOME_URL" -o /tmp/home-page.html || true
            if grep -Fq "data-build-sha=\"$EXPECTED_BUILD_SHA\"" /tmp/home-page.html; then
              echo "Verified live Worker build SHA: $EXPECTED_BUILD_SHA"
              exit 0
            fi
            echo "Waiting for Worker propagation ($attempt/12)..."
            sleep 10
          done
          echo "::error::Live Worker did not serve expected build SHA $EXPECTED_BUILD_SHA"
          grep -o 'data-build-sha[^ >]*' /tmp/home-page.html | head -1 || true
          exit 1
