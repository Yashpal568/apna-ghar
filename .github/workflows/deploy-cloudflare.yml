name: Deploy Cloudflare production

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1f6f29f6833bc91fbdfc10c3ba035ad
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions variable or secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) echo "Using Clerk Production publishable key." ;;
            pk_test_*) echo "::warning::Using Clerk Development key. This deployment is for temporary testing only; do not treat it as a production-auth launch." ;;
            *) echo "::error::Clerk publishable key must start with pk_live_ or pk_test_"; exit 1 ;;
          esac
      - name: Install locked workspace dependencies
        run: npm ci --include=dev
      - name: Build and deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1f6f29f6833bc91fbdfc10c3ba035ad
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_BASE_URL: https://apna-ghar-api-j4fo.onrender.com/api/v1
        run: npm run deploy:cloudflare
