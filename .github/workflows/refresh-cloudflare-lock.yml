name: Refresh Cloudflare frontend lockfile

on:
  push:
    branches: ["feat/cloudflare-workers-migration"]
    paths: [".github/workflows/refresh-cloudflare-lock.yml"]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-workers-migration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate standalone frontend lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --workspaces=false --include=dev --ignore-scripts
      - name: Commit frontend lockfile
        run: |
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend lockfile is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate standalone web lockfile for Cloudflare"
          git push origin HEAD:feat/cloudflare-workers-migration
