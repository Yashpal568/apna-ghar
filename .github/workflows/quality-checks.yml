name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --include=dev

      - name: Build NestJS API
        run: npm run build:api

      - name: Build Next.js website and admin UI
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmxleGlibGUtYmlzb24tNTQ5NC5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build:web
