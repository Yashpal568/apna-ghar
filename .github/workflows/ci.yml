name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile for Cloudflare migration branch
        if: github.ref == 'refs/heads/feat/cloudflare-workers-migration'
        run: |
          npm install --package-lock-only --include=dev --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh full npm workspace lockfile for Cloudflare"
            git push origin HEAD:feat/cloudflare-workers-migration
          fi
      - name: Install workspace dependencies
        run: npm install --include=dev
      - name: Typecheck API, web and mobile
        run: npm run typecheck
      - name: Test API unit suite
        run: npm run test:api -- --runInBand
      - name: Test API HTTP end-to-end suite
        run: npm run test:e2e:api
      - name: Build API
        run: npm run build:api
      - name: Build web
        run: npm run build:web
