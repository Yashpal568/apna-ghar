name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm install --include=dev
      - name: Typecheck API, web and mobile
        run: npm run typecheck
      - name: Test API unit suite
        run: npm run test:api -- --runInBand
      - name: Test API HTTP end-to-end suite
        run: npm run test:e2e:api
      - name: Build API
        run: npm run build:api
      - name: Build web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmxleGlibGUtYmlzb24tNTQ5NC5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build:web
