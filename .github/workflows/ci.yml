name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --include=dev

      - name: Typecheck API, web and mobile
        run: npm run typecheck

      - name: Test API unit suite
        run: npm run test:api

      - name: Test API HTTP end-to-end suite
        run: npm run test:e2e:api

      - name: Build API
        run: npm run build:api

      - name: Build web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmxleGlibGUtYmlzb24tNTQ5NC5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build:web

      - name: Build Cloudflare production artifact
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmxleGlibGUtYmlzb24tNTQ5NC5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_API_BASE_URL: https://apna-ghar-api-j4fo.onrender.com/api/v1
        run: npm run build:cloudflare
